<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f0eb">
  <meta name="description" content="SHIROKUMA CLINIC AZABUのクマ取り治療のご案内。横にスワイプしてご覧ください。">
  <title>クマ取り治療のご案内｜SHIROKUMA CLINIC AZABU</title>
  <link rel="preload" href="./assets/slide01.png" as="image">
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <main class="lp" aria-label="SHIROKUMA CLINIC AZABU クマ取り治療のご案内">
    <section class="carousel" aria-roledescription="カルーセル" aria-label="クマ取り治療のご案内 全9ページ">
      <div class="page-count" aria-live="polite" aria-atomic="true">
        <span id="current-page">1</span><span class="count-divider">/</span><span>9</span>
      </div>
      <div class="slides" id="slides" tabindex="0" aria-label="横にスワイプ、または左右の矢印キーでページを切り替え">
        <section class="slide" aria-roledescription="スライド" aria-label="1 / 8">
          <img src="./assets/slide01.png" width="750" height="1000" alt="SHIROKUMA CLINIC AZABU クマ取り治療のご案内" fetchpriority="high" draggable="false">
        </section>
        <section class="slide" aria-roledescription="スライド" aria-label="2 / 8">
          <img src="./assets/slide02.png" width="750" height="1000" alt="症例紹介 1" decoding="async" loading="lazy" draggable="false">
        </section>
        <section class="slide" aria-roledescription="スライド" aria-label="3 / 8">
          <img src="./assets/slide03.png" width="750" height="1000" alt="症例紹介 2" decoding="async" loading="lazy" draggable="false">
        </section>
        <section class="slide" aria-roledescription="スライド" aria-label="4 / 8">
          <img src="./assets/slide04.png" width="750" height="1000" alt="症例紹介 3" decoding="async" loading="lazy" draggable="false">
        </section>
        <section class="slide" aria-roledescription="スライド" aria-label="5 / 8">
          <img src="./assets/slide05.png" width="750" height="1000" alt="こんなお悩みありませんか" decoding="async" loading="lazy" draggable="false">
        </section>
        <section class="slide" aria-roledescription="スライド" aria-label="6 / 8">
          <img src="./assets/slide06.png" width="750" height="1000" alt="切らないクマ取りで疲れ顔卒業" decoding="async" loading="lazy" draggable="false">
        </section>
        <section class="slide" aria-roledescription="スライド" aria-label="7 / 8">
          <img src="./assets/slide07.png" width="750" height="1000" alt="当院が選ばれる理由" decoding="async" loading="lazy" draggable="false">
        </section>
        <section class="slide" aria-roledescription="スライド" aria-label="8 / 9">
          <img src="./assets/slide08.png" width="750" height="1000" alt="施術の流れ" decoding="async" loading="lazy" draggable="false">
        </section>
        <section class="slide" aria-roledescription="スライド" aria-label="9 / 9">
          <img src="./assets/slide09.png" width="750" height="1000" alt="院長紹介・クリニック情報" decoding="async" loading="lazy" draggable="false">
        </section>
      </div>
      <button class="arrow arrow-prev" id="prev" type="button" aria-label="前のページ" aria-controls="slides" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
      </button>
      <button class="arrow arrow-next" id="next" type="button" aria-label="次のページ" aria-controls="slides">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg>
      </button>
    </section>

    <!-- CTA フッター -->
    <footer class="cta" aria-label="カウンセリング予約">
      <a class="cta-link" href="https://shirokumaclinic.com/contact/" target="_blank" rel="noopener" aria-label="カウンセリング予約ページへ">
        <img src="./assets/cta-banner.png" width="2172" height="724" alt="目元のクマ治療 カウンセリング予約" draggable="false">
        <span class="cta-btn-shine" aria-hidden="true"></span>
      </a>
    </footer>
  </main>
</body>
</html>
